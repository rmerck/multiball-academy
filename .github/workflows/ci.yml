name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces the older run; runs on main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job builds SDL3 and Box2D from pinned, hash-checked sources
# (cmake/PinnedDeps.cmake), not from whatever a package manager has today.
#
# Their build tree (build/_deps: sources, objects and libraries) is cached,
# because compiling SDL is most of each job. The key names the runner image
# (and so the compiler), the job's configuration and the hash of the build
# files, with no fallback key: any change there builds from source again.
# Every run may restore. Only a push to main saves, and GitHub keeps a cache
# written by a pull request run visible to that pull request alone, so
# nothing a pull request does can change what main or another pull request
# links. Make still compares the restored objects with their sources and
# flags, and rebuilds whatever differs.
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sanitize: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner image
        id: image
        run: echo "id=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Restore the dependency build
        id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps
          key: deps-${{ steps.image.outputs.id }}-${{ runner.arch }}-RelWithDebInfo-san${{ matrix.sanitize }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
      - name: Configure
        env:
          SANITIZE: ${{ matrix.sanitize }}
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DPINBALL_FETCH_DEPS=ON
          -DPINBALL_WERROR=ON
          -DPINBALL_SANITIZE="$SANITIZE"
      - name: Build
        run: cmake --build build --parallel
      - name: Save the dependency build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The build that would be handed to someone: optimised, self-contained,
  # hardened runtime, and free of the build machine's paths.
  macos-release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner image
        id: image
        run: echo "id=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Restore the dependency build
        id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps
          key: deps-${{ steps.image.outputs.id }}-${{ runner.arch }}-Release-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DPINBALL_FETCH_DEPS=ON
          -DPINBALL_WERROR=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Save the dependency build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: No build paths in the binary
        run: |
          test -x build/pinball
          if strings -a build/pinball | grep -E '/Users/|/home/|/private/var/'; then
            echo "build paths found in the binary"; exit 1
          fi
      - name: Only system libraries are loaded
        run: |
          otool -L build/pinball
          if otool -L build/pinball | tail -n +2 | grep -v -E '^\s+(/System/Library/|/usr/lib/)'; then
            echo "non-system library dependency"; exit 1
          fi
      - name: Hardened runtime is on
        run: |
          codesign --verify --strict build/pinball
          codesign -dv build/pinball 2>&1 | grep -E 'flags=.*runtime'

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {cc: gcc, cxx: g++, build: RelWithDebInfo, sanitize: "ON"}
          - {cc: clang, cxx: clang++, build: RelWithDebInfo, sanitize: "ON"}
          # Optimised, as it would be handed out: other warnings appear at
          # this level, and the hardening is checked on the result.
          - {cc: gcc, cxx: g++, build: Release, sanitize: "OFF"}
          # The closest stand-in for the macOS standard library: libc++ with
          # its hardening on. It catches a missing include before macOS does.
          # Only the game's C++ takes the flag; SDL and Box2D are C.
          - {cc: clang, cxx: clang++, build: RelWithDebInfo, sanitize: "ON", stdlib: libc++}
    # The first three names are required checks: do not change them.
    name: linux (${{ matrix.cxx }}, ${{ matrix.stdlib || matrix.build }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner image
        id: image
        run: echo "id=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Restore the dependency build
        id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps
          key: deps-${{ steps.image.outputs.id }}-${{ runner.arch }}-${{ matrix.cxx }}-${{ matrix.stdlib || 'libstdc++' }}-${{ matrix.build }}-san${{ matrix.sanitize }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
      - name: Install build headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libegl1-mesa-dev \
            libgl1-mesa-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev
      - name: Install libc++
        if: matrix.stdlib == 'libc++'
        run: sudo apt-get install -y --no-install-recommends libc++-18-dev libc++abi-18-dev
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          # Empty for the other jobs, which changes nothing.
          CXXFLAGS: ${{ matrix.stdlib && format('-stdlib={0}', matrix.stdlib) || '' }}
          BUILD_TYPE: ${{ matrix.build }}
          SANITIZE: ${{ matrix.sanitize }}
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE="$BUILD_TYPE"
          -DPINBALL_FETCH_DEPS=ON
          -DPINBALL_WERROR=ON
          -DPINBALL_SANITIZE="$SANITIZE"
      - name: Build
        run: cmake --build build --parallel
      - name: Save the dependency build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Hardening is present in the Release binary
        if: matrix.build == 'Release'
        run: |
          test -x build/pinball
          readelf -h build/pinball | grep -E 'Type:\s+DYN'
          readelf -d build/pinball | grep -E 'BIND_NOW'
          readelf -lW build/pinball | grep -E 'GNU_RELRO'
          readelf -lW build/pinball | grep -E 'GNU_STACK\s.*RW\s'
          readelf -W --dyn-syms build/pinball | grep -E '__stack_chk_fail'
          readelf -W --dyn-syms build/pinball | grep -v stack_chk | grep -E '__[a-z]+_chk'
          readelf -n build/pinball | grep -E 'IBT, SHSTK'
          if strings -a build/pinball | grep -E '/home/|/Users/'; then
            echo "build paths found in the binary"; exit 1
          fi

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DPINBALL_FUZZ=ON
          -DPINBALL_SANITIZE=ON
          -DPINBALL_WERROR=ON
      - name: Build
        run: cmake --build build --parallel --target pinball_fuzz
      - name: Fuzz the parsers
        run: |
          mkdir found
          ./build/pinball_fuzz -max_total_time=120 -max_len=1024 -print_final_stats=1 \
            -dict=tests/fuzz/parsers.dict found tests/fuzz/corpus
      - name: Keep what the fuzzer found
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings
          path: |
            crash-*
            leak-*
            oom-*
            timeout-*
          if-no-files-found: ignore
