name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces the older run; runs on main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job builds SDL3 and Box2D from pinned sources that are fetched and
# checked afresh on every run (cmake/PinnedDeps.cmake): the SDL archive
# against its SHA-256, Box2D by its commit id. No source tree is ever taken
# from a cache.
#
# What is cached is SDL's build output alone (build/_deps/sdl3-build: its
# objects and the files its build generates), because compiling SDL is most
# of each job. The freshly checked sources are unpacked with the dates they
# have in the archive, so Make sees the restored objects as up to date, and
# compares them with their sources and flags as usual. The key names the
# runner image (and so the compiler), the job's configuration and the hash
# of the build files, which hold the pinned SDL version and its SHA-256,
# with no fallback key: any change there compiles SDL again. A restore that
# brings anything else into the build directory, such as a source tree,
# stops the job (tools/check_deps_cache.sh). Box2D is small: it is cloned
# and compiled on every run.
#
# Every run may restore. Only a push to main saves, and GitHub keeps a cache
# written by a pull request run visible to that pull request alone, so
# nothing a pull request does can change what main or another pull request
# links. The restored build output is trusted on that ground alone: it is
# not checked against anything.
#
# PINBALL_REQUIRE_ALL_TESTS stops a job at configure time if a test could
# not be registered, and ctest fails if it finds none to run.
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sanitize: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner image
        id: image
        run: echo "id=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Restore the SDL objects
        id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps/sdl3-build
          key: sdl-objects-${{ steps.image.outputs.id }}-${{ runner.arch }}-RelWithDebInfo-san${{ matrix.sanitize }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
      - name: The cache holds SDL's build output and nothing else
        run: sh tools/check_deps_cache.sh build
      - name: Configure
        env:
          SANITIZE: ${{ matrix.sanitize }}
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DPINBALL_FETCH_DEPS=ON
          -DPINBALL_WERROR=ON
          -DPINBALL_REQUIRE_ALL_TESTS=ON
          -DPINBALL_SANITIZE="$SANITIZE"
      - name: Build
        run: cmake --build build --parallel
      - name: Save the SDL objects
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps/sdl3-build
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

  # The build that would be handed to someone: an application bundle that is
  # optimised, self-contained, signed with the hardened runtime, and free of
  # the build machine's paths.
  macos-release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner image
        id: image
        run: echo "id=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Restore the SDL objects
        id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps/sdl3-build
          key: sdl-objects-${{ steps.image.outputs.id }}-${{ runner.arch }}-Release-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
      - name: The cache holds SDL's build output and nothing else
        run: sh tools/check_deps_cache.sh build
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DPINBALL_FETCH_DEPS=ON
          -DPINBALL_WERROR=ON
          -DPINBALL_REQUIRE_ALL_TESTS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Save the SDL objects
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps/sdl3-build
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error
      # The steps below take the bundle's name, identifier and version from
      # build/product.env, which CMake writes from the one name block in
      # CMakeLists.txt, so that nothing here spells them out a second time.
      # The file is read as text (tools/product_value.sh), not run.
      - name: No build paths in the binary
        run: |
          name=$(sh tools/product_value.sh build/product.env PINBALL_APP_NAME)
          exe="build/$name.app/Contents/MacOS/$name"
          test -x "$exe"
          if strings -a "$exe" | grep -E '/Users/|/home/|/private/var/'; then
            echo "build paths found in the binary"; exit 1
          fi
      - name: Only system libraries are loaded
        run: |
          name=$(sh tools/product_value.sh build/product.env PINBALL_APP_NAME)
          exe="build/$name.app/Contents/MacOS/$name"
          otool -L "$exe"
          if otool -L "$exe" | tail -n +2 | grep -v -E '^\s+(/System/Library/|/usr/lib/)'; then
            echo "non-system library dependency"; exit 1
          fi
      - name: The bundle is complete
        run: |
          name=$(sh tools/product_value.sh build/product.env PINBALL_APP_NAME)
          identifier=$(sh tools/product_value.sh build/product.env PINBALL_BUNDLE_ID)
          version=$(sh tools/product_value.sh build/product.env PINBALL_VERSION)
          number=$(sh tools/product_value.sh build/product.env PINBALL_BUILD_NUMBER)
          test -n "$name" && test -n "$identifier" && test -n "$version" && test -n "$number"
          app="build/$name.app"
          plist="$app/Contents/Info.plist"
          plutil -lint "$plist"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$plist")" = "$identifier"
          test "$(plutil -extract CFBundleName raw -o - "$plist")" = "$name"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$plist")" = "$version"
          test "$(plutil -extract CFBundleVersion raw -o - "$plist")" = "$number"
          test "$(plutil -extract CFBundleIconFile raw -o - "$plist")" = AppIcon
          test -s "$app/Contents/Resources/AppIcon.icns"
          test -d "$app/Contents/Resources/assets"
          # The development tools stay outside the bundle.
          test "$(ls "$app/Contents/MacOS")" = "$name"
          sh -n tools/notarize.sh
          sh -n tools/make_icns.sh
      - name: The bundle's signature verifies and the hardened runtime is on
        run: |
          name=$(sh tools/product_value.sh build/product.env PINBALL_APP_NAME)
          app="build/$name.app"
          # After the tests on purpose: nothing they do may touch the bundle.
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E 'flags=.*runtime'
          codesign -dv "$app/Contents/MacOS/$name" 2>&1 | grep -E 'flags=.*runtime'

  # The iOS application, built as it would be for release: optimised,
  # warnings as errors, nothing signed. Once for the simulator and once for a
  # device, from one configuration. Each bundle is taken apart, and inside a
  # simulator the core and file handling tests are run, compiled with the
  # iOS SDK, and the game is started for a timed run. The image's Xcode is named, not
  # left to the image's default.
  #
  # Nothing is cached. What takes the time is SDL asking the compiler some
  # 350 questions, each a run of xcodebuild; their answers for this Xcode are
  # recorded in cmake/preseed and applied by cmake/IosPreseed.cmake, which
  # checks that they were recorded for this Xcode, SDK, deployment target and
  # SDL pin and otherwise applies nothing. Then the questions are all asked,
  # which is slow but right, and the job offers the new record as an artifact
  # to be reviewed and committed.
  ios:
    name: ios (simulator)
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Xcode and SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          cmake --version
      - name: Configure
        run: >
          cmake -S . -B build-ios-sim -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_SYSROOT=iphonesimulator
          -C cmake/IosPreseed.cmake
          -DPINBALL_FETCH_DEPS=ON
          -DPINBALL_WERROR=ON
          -DPINBALL_IOS_TEST_EXIT=ON
      - name: Record SDL's configure results if none were applied
        id: preseed
        run: |
          if grep -q '^PINBALL_IOS_PRESEED:INTERNAL=.' build-ios-sim/CMakeCache.txt; then
            echo "recorded=no" >> "$GITHUB_OUTPUT"
          else
            mkdir preseed-new
            cmake -DBUILD=build-ios-sim -DOUTPUT_DIR="$PWD/preseed-new" -P cmake/MakeIosPreseed.cmake
            # Also in the log, for whoever reads the run without the artifact.
            for record in preseed-new/*.txt; do
              echo "::group::$record"
              cat "$record"
              echo "::endgroup::"
            done
            echo "recorded=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Offer the new record
        if: steps.preseed.outputs.recorded == 'yes'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-preseed
          path: preseed-new/
          if-no-files-found: error
      - name: Build for the simulator
        run: cmake --build build-ios-sim --config Release -- -quiet
      - name: The simulator bundle is complete
        run: |
          name=$(sh tools/product_value.sh build-ios-sim/product.env PINBALL_APP_NAME)
          app="build-ios-sim/Release-iphonesimulator/$name.app"
          ls -la "$app" "$app/assets"
          plutil -p "$app/Info.plist"
          bash tools/ios/check_bundle.sh "$app" build-ios-sim/product.env . --release
      # The game itself is started too, for 300 frames: this build honours
      # --frames and ends by itself (PINBALL_IOS_TEST_EXIT), which the one
      # that is submitted does not.
      - name: Tests and a timed run of the game on a simulator
        run: bash tools/ios/simulator_tests.sh build-ios-sim Release
      # The slice that is shipped. Same project, the device SDK.
      - name: Build for a device
        run: >
          xcodebuild -project build-ios-sim/MultiballAcademy.xcodeproj
          -target pinball -configuration Release -sdk iphoneos
          CODE_SIGNING_ALLOWED=NO -quiet build
      - name: The device bundle is complete
        run: |
          name=$(sh tools/product_value.sh build-ios-sim/product.env PINBALL_APP_NAME)
          app="build-ios-sim/Release-iphoneos/$name.app"
          xcrun vtool -show-build "$app/$name"
          xcrun vtool -show-build "$app/$name" | grep -E 'platform IOS$'
          bash tools/ios/check_bundle.sh "$app" build-ios-sim/product.env . --release

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {cc: gcc, cxx: g++, build: RelWithDebInfo, sanitize: "ON"}
          - {cc: clang, cxx: clang++, build: RelWithDebInfo, sanitize: "ON"}
          # Optimised, as it would be handed out: other warnings appear at
          # this level, and the hardening is checked on the result.
          - {cc: gcc, cxx: g++, build: Release, sanitize: "OFF"}
          # The closest stand-in for the macOS standard library: libc++ with
          # its hardening on. It catches a missing include before macOS does.
          # Only the game's C++ takes the flag; SDL and Box2D are C.
          - {cc: clang, cxx: clang++, build: RelWithDebInfo, sanitize: "ON", stdlib: libc++}
    # The first three names are required checks: do not change them.
    name: linux (${{ matrix.cxx }}, ${{ matrix.stdlib || matrix.build }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner image
        id: image
        run: echo "id=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Restore the SDL objects
        id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps/sdl3-build
          key: sdl-objects-${{ steps.image.outputs.id }}-${{ runner.arch }}-${{ matrix.cxx }}-${{ matrix.stdlib || 'libstdc++' }}-${{ matrix.build }}-san${{ matrix.sanitize }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
      - name: Install build headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libegl1-mesa-dev \
            libgl1-mesa-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev
      - name: Install libc++
        if: matrix.stdlib == 'libc++'
        run: sudo apt-get install -y --no-install-recommends libc++-18-dev libc++abi-18-dev
      - name: The cache holds SDL's build output and nothing else
        run: sh tools/check_deps_cache.sh build
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          # Empty for the other jobs, which changes nothing.
          CXXFLAGS: ${{ matrix.stdlib && format('-stdlib={0}', matrix.stdlib) || '' }}
          BUILD_TYPE: ${{ matrix.build }}
          SANITIZE: ${{ matrix.sanitize }}
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE="$BUILD_TYPE"
          -DPINBALL_FETCH_DEPS=ON
          -DPINBALL_WERROR=ON
          -DPINBALL_REQUIRE_ALL_TESTS=ON
          -DPINBALL_SANITIZE="$SANITIZE"
      - name: Build
        run: cmake --build build --parallel
      - name: Save the SDL objects
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps/sdl3-build
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error
      - name: Hardening is present in the Release binary
        if: matrix.build == 'Release'
        run: |
          test -x build/pinball
          readelf -h build/pinball | grep -E 'Type:\s+DYN'
          readelf -d build/pinball | grep -E 'BIND_NOW'
          readelf -lW build/pinball | grep -E 'GNU_RELRO'
          readelf -lW build/pinball | grep -E 'GNU_STACK\s.*RW\s'
          readelf -n build/pinball | grep -E 'IBT, SHSTK'
          # The stack protector and FORTIFY are checked on the game's own
          # translation units and objects, not on the linked binary, where
          # the statically linked SDL would answer for them.
          python3 -I tools/check_hardening.py build
          if strings -a build/pinball | grep -E '/home/|/Users/'; then
            echo "build paths found in the binary"; exit 1
          fi

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DPINBALL_FUZZ=ON
          -DPINBALL_SANITIZE=ON
          -DPINBALL_WERROR=ON
      - name: Build
        run: cmake --build build --parallel --target pinball_fuzz
      - name: Fuzz the parsers
        run: |
          mkdir found
          # 2048: a saved game's file (tests/fuzz/corpus/save_file) is about 1.2 kB.
          ./build/pinball_fuzz -max_total_time=120 -max_len=2048 -print_final_stats=1 \
            -dict=tests/fuzz/parsers.dict found tests/fuzz/corpus
      - name: Keep what the fuzzer found
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings
          path: |
            crash-*
            leak-*
            oom-*
            timeout-*
          if-no-files-found: ignore
